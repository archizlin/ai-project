<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casio 工程計算機</title><style>body{margin:0;background:#d7d7d4;font-family:Arial,"Microsoft JhengHei",sans-serif}.box{position:fixed;left:18px;top:18px;width:286px;padding:12px;border-radius:14px;background:linear-gradient(145deg,#3b3b3b,#1e1e1e);color:#eee;box-shadow:0 14px 30px #0006}.title{font-size:12px;font-weight:700;letter-spacing:.1em;margin-bottom:8px}.display{background:#9da49a;color:#182019;border:4px solid #111;border-radius:4px;padding:8px;text-align:right;margin-bottom:8px}.expr{font-size:12px;min-height:18px;overflow:hidden}.value{font-size:34px;min-height:42px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.keys button{min-height:36px;border:1px solid #111;border-radius:5px;background:#666;color:#fff;font-weight:700}.keys .op{background:#333}.keys .eq{background:#c4c4c0;color:#111}.hint{font-size:10px;color:#aaa;text-align:center;margin-top:8px}</style></head><body><main class="box"><div class="title">fx SCIENTIFIC · ENGINEERING</div><div class="display"><div class="expr" id="expr">輸入計算式</div><div class="value" id="value">0</div></div><div class="keys"><button data-v="sin(">sin</button><button data-v="cos(">cos</button><button data-v="tan(">tan</button><button data-v="sqrt(">√</button><button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button><button class="op" data-v="/">÷</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button class="op" data-v="*">×</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button class="op" data-v="-">−</button><button data-v="0">0</button><button data-v=".">.</button><button class="op" data-v="+">+</button><button class="eq" id="go">=</button><button class="op" id="clear">AC</button></div><div class="hint">Enter 計算 · Esc 清除</div></main><script>(()=>{let s='',last=0;const e=id=>document.querySelector(id),show=()=>{e('#expr').textContent=s||'輸入計算式';e('#value').textContent=s||'0'},calc=()=>{try{const t=s.replace(/sin(/g,'Math.sin(').replace(/cos(/g,'Math.cos(').replace(/tan(/g,'Math.tan(').replace(/sqrt(/g,'Math.sqrt(');last=Function('return '+t)();s=String(Number(last.toPrecision(12)));e('#expr').textContent='結果 =';show()}catch{e('#value').textContent='Error'}};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{s+=b.dataset.v;show()});e('#go').onclick=calc;e('#clear').onclick=()=>{s='';show()};window.onkeydown=x=>{if(x.key==='Enter')calc();if(x.key==='Escape'){s='';show()}};show()})()</script></body></html>
