<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engineering Calculator · macOS inspired</title>
  <style>
    :root{--card:rgba(31,31,34,.9);--ink:#f5f5f7;--muted:#98989d;--soft:#3a3a3e;--orange:#66666b;--blue:#8d8d93;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Noto Sans TC",sans-serif;background:radial-gradient(circle at 18% 10%,#4a4a4f 0 9%,transparent 32%),linear-gradient(145deg,#111113,#29292d 48%,#09090a)}.shell{width:min(94vw,560px);padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:var(--card);box-shadow:0 28px 80px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.35);backdrop-filter:blur(24px)}.topbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 3px}.traffic{display:flex;gap:7px}.traffic span{width:11px;height:11px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.35)}.red{background:#727277}.yellow{background:#85858a}.green{background:#99999e}.label{color:var(--muted);font-size:11px;letter-spacing:.08em;font-weight:650}.display{min-height:130px;padding:14px 12px 16px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden}.expression{width:100%;min-height:25px;color:var(--muted);font:500 16px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.value{max-width:100%;font-size:clamp(42px,10vw,68px);line-height:1;font-weight:300;letter-spacing:-.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.error{color:#d0d0d3}.mode-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}.mode-row button{min-width:68px;height:32px;border:0;border-radius:11px;font-size:13px;color:var(--ink);background:var(--soft);cursor:pointer}.mode-row .active{color:#111113;background:#d8d8dc}.mode-label{margin-left:auto;color:var(--muted);font-size:12px}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.keys button{min-height:51px;border:0;border-radius:15px;background:var(--soft);color:var(--ink);font:500 17px -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC",sans-serif;cursor:pointer;transition:transform .08s ease,filter .15s ease,background .15s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}.keys button:hover{filter:brightness(1.15)}.keys button:active{transform:scale(.95)}.keys button:focus-visible{outline:3px solid rgba(255,255,255,.35);outline-offset:2px}.fn{font-size:15px!important;background:#4b4b50!important}.operator{color:#fff!important;background:var(--orange)!important;font-size:23px!important}.equal{color:#111113!important;background:#d8d8dc!important}.wide{grid-column:span 2}.dark{background:#303034!important}.history{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}.history-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:5px}.history-head button{border:0;background:none;color:#d0d0d3;font:inherit;cursor:pointer}.history-list{max-height:92px;overflow:auto;display:flex;flex-direction:column;gap:2px}.history-list button{border:0;background:transparent;text-align:right;color:#b0b0b5;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;padding:4px;cursor:pointer}.history-list button:hover{background:rgba(255,255,255,.08);border-radius:7px}.empty{color:#77777d;font-size:12px;text-align:right;padding:4px}.hint{text-align:center;color:var(--muted);font-size:11px;padding:12px 0 1px}@media(max-width:500px){.shell{border-radius:24px;padding:10px}.keys{gap:6px}.keys button{min-height:47px;border-radius:13px;font-size:15px}.fn{font-size:13px!important}.display{min-height:120px}}
    /* Casio-inspired scientific calculator skin */
    body{background:#d7d7d4;place-items:center}
    .shell{width:min(94vw,620px);padding:18px 18px 16px;border:1px solid #151515;border-radius:18px;background:linear-gradient(145deg,#3b3b3b,#1e1e1e 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 18px 32px rgba(0,0,0,.35);backdrop-filter:none}
    .topbar{height:34px;padding:0 4px 7px}.traffic{display:none}.label{color:#c5c5c5;font-size:12px;letter-spacing:.14em;font-weight:700;text-shadow:0 1px #000}
    .display{min-height:118px;margin:0 2px 14px;padding:12px 16px;border:5px solid #111;border-radius:5px;background:linear-gradient(180deg,#9da49a,#7e887b);box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.15);align-items:flex-end}
    .expression{color:#263128;font-size:15px;font-weight:700;text-shadow:0 1px rgba(255,255,255,.2)}.value{color:#182019;font-size:clamp(42px,9vw,66px);font-weight:500;letter-spacing:-.05em;text-shadow:0 1px rgba(255,255,255,.18)}.error{color:#3a1717}
    .mode-row{margin:0 2px 10px;gap:7px}.mode-row button{min-width:65px;height:27px;border-radius:4px;color:#e5e5e5;background:#252525;border:1px solid #111;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 1px 1px #111;font-size:12px;font-weight:700}.mode-row .active{color:#171717;background:#b6b6b2}.mode-label{color:#a9a9a9;font-size:11px}
    .keys{gap:7px}.keys button{min-height:48px;border-radius:6px;border:1px solid #151515;background:linear-gradient(180deg,#777,#4b4b4b);color:#f2f2f2;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #111;font-size:16px;font-weight:700;text-shadow:0 1px #111}.keys button:hover{filter:brightness(1.15)}.keys button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 #111}.fn{background:linear-gradient(180deg,#343434,#1c1c1c)!important;color:#d7d7d7!important;font-size:14px!important}.dark{background:linear-gradient(180deg,#a8a8a4,#777773)!important;color:#111!important;text-shadow:0 1px rgba(255,255,255,.25)!important}.operator{background:linear-gradient(180deg,#565656,#2b2b2b)!important;color:#fff!important}.equal{background:linear-gradient(180deg,#c4c4c0,#8f8f8b)!important;color:#111!important;text-shadow:0 1px rgba(255,255,255,.35)!important}.history{border-top:1px solid #555;margin-top:15px;padding-top:9px}.history-head{color:#ababab}.history-head button{color:#d0d0cc}.history-list button{color:#bfc0ba}.history-list button:hover{background:rgba(255,255,255,.1)}.empty{color:#777}.hint{color:#8c8c8c}
    @media(max-width:500px){.shell{padding:14px 12px 13px;border-radius:14px}.keys{gap:5px}.keys button{min-height:45px;border-radius:5px}.display{margin-bottom:11px}}
    /* Compact, movable body: keeps the calculator at roughly one-fifth of the viewport. */
    body{display:block;overflow:hidden}
    .shell{position:fixed;left:24px;top:24px;width:min(320px,calc(100vw - 24px));min-width:270px;padding:10px 10px 9px;border-radius:14px}
    .topbar{height:27px;padding:0 4px 5px;cursor:grab;user-select:none}.topbar:active{cursor:grabbing}.label{font-size:9px;letter-spacing:.09em;white-space:nowrap}
    .display{min-height:78px;margin:0 1px 8px;padding:7px 9px;border-width:4px}.expression{min-height:18px;font-size:10px}.value{font-size:clamp(30px,5vw,43px)}
    .mode-row{gap:4px;margin:0 1px 6px}.mode-row button{min-width:47px;height:23px;font-size:10px}.mode-label{font-size:9px}
    .keys{gap:4px}.keys button{min-height:32px;border-radius:5px;font-size:12px}.fn{font-size:10px!important}.operator{font-size:16px!important}
    .history{margin-top:8px;padding-top:6px}.history-head{font-size:9px}.history-list{max-height:40px}.history-list button{font-size:9px;padding:2px}.empty{font-size:9px}.hint{font-size:8px;padding:6px 0 0}
    @media(max-width:600px){.shell{width:calc(100vw - 24px);min-width:0;max-width:320px}}
  </style>
</head>
<body>
  <main class="shell" aria-label="macOS 風格工程計算機">
    <div class="topbar"><div class="traffic" aria-hidden="true"><span class="red"></span><span class="yellow"></span><span class="green"></span></div><span class="label">fx SCIENTIFIC · ENGINEERING CALCULATOR</span></div>
    <section class="display" aria-live="polite"><div class="expression" id="expression">輸入計算式</div><div class="value" id="display">0</div></section>
    <div class="mode-row"><button id="deg" class="active">DEG</button><button id="rad">RAD</button><span class="mode-label">可直接編輯計算列式</span></div>
    <section class="keys">
      <button class="fn" data-insert="sin(">sin</button><button class="fn" data-insert="cos(">cos</button><button class="fn" data-insert="tan(">tan</button><button class="fn" data-insert="asin(">sin⁻¹</button><button class="fn" data-insert="acos(">cos⁻¹</button><button class="fn" data-insert="atan(">tan⁻¹</button>
      <button class="fn" data-insert="ln(">ln</button><button class="fn" data-insert="log(">log</button><button class="fn" data-insert="sqrt(">√</button><button class="fn" data-insert="cbrt(">∛</button><button class="fn" data-insert="^2">x²</button><button class="fn" data-insert="^">xʸ</button>
      <button class="fn" data-insert="(">(</button><button class="fn" data-insert=")">)</button><button class="fn" data-insert="!">x!</button><button class="fn" data-insert="π">π</button><button class="fn" data-insert="e">e</button><button class="fn" data-action="ans">Ans</button>
      <button class="dark" data-action="clear">AC</button><button class="dark" data-action="backspace">⌫</button><button class="dark" data-action="percent">%</button><button class="dark" data-action="sign">±</button><button class="operator" data-insert="÷">÷</button><button class="operator" data-insert="×">×</button>
      <button data-insert="7">7</button><button data-insert="8">8</button><button data-insert="9">9</button><button class="operator" data-insert="−">−</button><button class="operator" data-insert="+">+</button><button class="equal" data-action="equals">=</button>
      <button data-insert="4">4</button><button data-insert="5">5</button><button data-insert="6">6</button><button class="wide" data-insert="0">0</button><button data-insert=".">.</button>
      <button data-insert="1">1</button><button data-insert="2">2</button><button data-insert="3">3</button><button class="wide" data-action="clear">清除</button><button data-action="equals">計算</button>
    </section>
    <section class="history"><div class="history-head"><span>計算紀錄</span><button id="clearHistory">清除紀錄</button></div><div id="historyList" class="history-list"><div class="empty">尚無紀錄</div></div></section>
    <div class="hint">鍵盤支援 · Enter 計算 · Esc 清除 · ⌫ 退格</div>
  </main>
  <script>
    (()=>{const display=document.querySelector('#display'),expression=document.querySelector('#expression'),historyList=document.querySelector('#historyList');let input='',lastAnswer=0,angleMode='DEG',justSolved=false,history=[];const $=s=>document.querySelector(s);const formatNumber=s=>{if(!/^[-]?\d+(\.\d+)?$/.test(String(s)))return s;const [whole,decimal]=String(s).split('.');return Number(whole).toLocaleString('en-US')+(decimal!==undefined?'.'+decimal:'')};const render=()=>{display.textContent=formatNumber(input||'0');expression.textContent=input||'輸入計算式'};const insert=v=>{if(justSolved&&!/[+−×÷^!)%]/.test(v))input='';justSolved=false;input+=v;render()};const clear=()=>{input='';justSolved=false;display.classList.remove('error');render()};const backspace=()=>{input=input.slice(0,-1);justSolved=false;render()};const factorial=n=>{if(n<0||n>170||!Number.isInteger(n))throw Error('階乘需要非負整數');let r=1;for(let i=2;i<=n;i++)r*=i;return r};
      function tokenize(s){s=s.replace(/\s+/g,'').replace(/π/g,'pi').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');const out=[];let i=0;while(i<s.length){const c=s[i];if(/[0-9.]/.test(c)){let n=c;i++;while(i<s.length&&/[0-9.eE+-]/.test(s[i])){if((s[i]=='+'||s[i]=='-')&&!/[eE]/.test(s[i-1]))break;n+=s[i++]}out.push({t:'num',v:Number(n)});continue}if(/[a-zA-Z]/.test(c)){let n=c;i++;while(i<s.length&&/[a-zA-Z0-9]/.test(s[i]))n+=s[i++];out.push({t:'name',v:n});continue}if('+-*/^()%!'.includes(c)){out.push({t:c,v:c});i++;continue}throw Error('無法辨識的符號')}return out}
      function evaluate(s){const ts=tokenize(s);let pos=0;const peek=()=>ts[pos],eat=t=>peek()?.t===t?ts[pos++]:null;const primary=()=>{if(eat('(')){const v=add();if(!eat(')'))throw Error('括號不完整');return v}if(peek()?.t==='num')return ts[pos++].v;if(peek()?.t==='name'){const name=ts[pos++].v;if(name==='pi')return Math.PI;if(name==='e')return Math.E;if(name==='Ans')return lastAnswer;if(!eat('('))throw Error('函數需要括號');const v=add();if(!eat(')'))throw Error('括號不完整');const a=angleMode==='DEG'?Math.PI/180:1,f={sin:x=>Math.sin(x*a),cos:x=>Math.cos(x*a),tan:x=>Math.tan(x*a),asin:x=>Math.asin(x)/a,acos:x=>Math.acos(x)/a,atan:x=>Math.atan(x)/a,ln:Math.log,log:Math.log10,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,exp:Math.exp}[name];if(!f)throw Error('未知函數');return f(v)}if(eat('+'))return primary();if(eat('-'))return -primary();throw Error('請輸入完整計算式')};const power=()=>{let v=primary();while(eat('!'))v=factorial(v);if(eat('^'))v=Math.pow(v,power());return v};const mul=()=>{let v=power();while(peek()&&(peek().t==='*'||peek().t==='/')){const op=ts[pos++].t,n=power();v=op==='*'?v*n:v/n}return v};const add=()=>{let v=mul();while(peek()&&(peek().t==='+'||peek().t==='-')){const op=ts[pos++].t,n=mul();v=op==='+'?v+n:v-n}return v};const result=add();if(pos<ts.length)throw Error('計算式結尾有誤');if(!Number.isFinite(result))throw Error('結果無法定義');return result}
      const renderHistory=()=>{historyList.innerHTML=history.length?history.map((h,i)=>`<button data-history="${i}">${h.q} = ${formatNumber(h.a)}</button>`).join(''):'<div class="empty">尚無紀錄</div>';historyList.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{input=history[+b.dataset.history].q;justSolved=false;render()})};const calculate=()=>{if(!input)return;try{const original=input,result=evaluate(input.replace(/%/g,'/100')),shown=Number(result.toPrecision(12));lastAnswer=result;history.unshift({q:original,a:String(shown)});history=history.slice(0,8);renderHistory();input=String(shown);justSolved=true;display.classList.remove('error');render();expression.textContent=original+' ='}catch(e){display.textContent='Error';display.classList.add('error');expression.textContent=e.message}};
      document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>insert(b.dataset.insert));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='clear')clear();if(a==='backspace')backspace();if(a==='equals')calculate();if(a==='ans')insert('Ans');if(a==='percent')insert('%');if(a==='sign'){input=input.startsWith('-')?input.slice(1):'-('+input+')';render()}});$('#deg').onclick=()=>{angleMode='DEG';$('#deg').classList.add('active');$('#rad').classList.remove('active')};$('#rad').onclick=()=>{angleMode='RAD';$('#rad').classList.add('active');$('#deg').classList.remove('active')};$('#clearHistory').onclick=()=>{history=[];renderHistory()};window.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='='){e.preventDefault();calculate()}else if(e.key==='Escape')clear();else if(e.key==='Backspace')backspace();else if(/^[0-9.]$/.test(e.key))insert(e.key);else if('+-*/^()%'.includes(e.key))insert(e.key)});render()})();
  </script>
  <script>
    (()=>{const panel=document.querySelector('.shell'),handle=document.querySelector('.topbar');let dragging=false,dx=0,dy=0;handle.addEventListener('pointerdown',e=>{dragging=true;dx=e.clientX-panel.offsetLeft;dy=e.clientY-panel.offsetTop;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!dragging)return;const maxX=Math.max(8,window.innerWidth-panel.offsetWidth-8),maxY=Math.max(8,window.innerHeight-panel.offsetHeight-8);panel.style.left=Math.min(maxX,Math.max(8,e.clientX-dx))+'px';panel.style.top=Math.min(maxY,Math.max(8,e.clientY-dy))+'px'});handle.addEventListener('pointerup',()=>{dragging=false});handle.addEventListener('pointercancel',()=>{dragging=false});window.addEventListener('resize',()=>{panel.style.left=Math.min(parseInt(panel.style.left||'24',10),Math.max(8,innerWidth-panel.offsetWidth-8))+'px';panel.style.top=Math.min(parseInt(panel.style.top||'24',10),Math.max(8,innerHeight-panel.offsetHeight-8))+'px'})})();
  </script>
</body>
</html>
