    /* Casio-inspired scientific calculator skin */
    body{background:#d7d7d4;place-items:center}
    .shell{width:min(94vw,620px);padding:18px 18px 16px;border:1px solid #151515;border-radius:18px;background:linear-gradient(145deg,#3b3b3b,#1e1e1e 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 18px 32px rgba(0,0,0,.35);backdrop-filter:none}
    .topbar{height:34px;padding:0 4px 7px}.traffic{display:none}.label{color:#c5c5c5;font-size:12px;letter-spacing:.14em;font-weight:700;text-shadow:0 1px #000}
    .display{min-height:118px;margin:0 2px 14px;padding:12px 16px;border:5px solid #111;border-radius:5px;background:linear-gradient(180deg,#9da49a,#7e887b);box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.15);align-items:flex-end}
    .expression{color:#263128;font-size:15px;font-weight:700;text-shadow:0 1px rgba(255,255,255,.2)}.value{color:#182019;font-size:clamp(42px,9vw,66px);font-weight:500;letter-spacing:-.05em;text-shadow:0 1px rgba(255,255,255,.18)}.error{color:#3a1717}
    .mode-row{margin:0 2px 10px;gap:7px}.mode-row button{min-width:65px;height:27px;border-radius:4px;color:#e5e5e5;background:#252525;border:1px solid #111;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 1px 1px #111;font-size:12px;font-weight:700}.mode-row .active{color:#171717;background:#b6b6b2}.mode-label{color:#a9a9a9;font-size:11px}
    .keys{gap:7px}.keys button{min-height:48px;border-radius:6px;border:1px solid #151515;background:linear-gradient(180deg,#777,#4b4b4b);color:#f2f2f2;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #111;font-size:16px;font-weight:700;text-shadow:0 1px #111}.keys button:hover{filter:brightness(1.15)}.keys button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 #111}.fn{background:linear-gradient(180deg,#343434,#1c1c1c)!important;color:#d7d7d7!important;font-size:14px!important}.dark{background:linear-gradient(180deg,#a8a8a4,#777773)!important;color:#111!important;text-shadow:0 1px rgba(255,255,255,.25)!important}.operator{background:linear-gradient(180deg,#565656,#2b2b2b)!important;color:#fff!important}.equal{background:linear-gradient(180deg,#c4c4c0,#8f8f8b)!important;color:#111!important;text-shadow:0 1px rgba(255,255,255,.35)!important}.history{border-top:1px solid #555;margin-top:15px;padding-top:9px}.history-head{color:#ababab}.history-head button{color:#d0d0cc}.history-list button{color:#bfc0ba}.history-list button:hover{background:rgba(255,255,255,.1)}.empty{color:#777}.hint{color:#8c8c8c}

    <section class="display" aria-live="polite"><div class="expression" id="expression">輸入計算式</div><div class="value" id="display">0</div></section>

    <section class="keys">
      <button class="fn" data-insert="sin(">sin</button><button class="fn" data-insert="cos(">cos</button><button class="fn" data-insert="tan(">tan</button><button class="fn" data-insert="asin(">sin⁻¹</button><button class="fn" data-insert="acos(">cos⁻¹</button><button class="fn" data-insert="atan(">tan⁻¹</button>
      <button class="fn" data-insert="ln(">ln</button><button class="fn" data-insert="log(">log</button><button class="fn" data-insert="sqrt(">√</button><button class="fn" data-insert="cbrt(">∛</button><button class="fn" data-insert="^2">x²</button><button class="fn" data-insert="^">xʸ</button>
      <button class="fn" data-insert="(">(</button><button class="fn" data-insert=")">)</button><button class="fn" data-insert="!">x!</button><button class="fn" data-insert="π">π</button><button class="fn" data-insert="e">e</button><button class="fn" data-action="ans">Ans</button>
      <button class="dark" data-action="clear">AC</button><button class="dark" data-action="backspace">⌫</button><button class="dark" data-action="percent">%</button><button class="dark" data-action="sign">±</button><button class="operator" data-insert="÷">÷</button><button class="operator" data-insert="×">×</button>
      <button data-insert="7">7</button><button data-insert="8">8</button><button data-insert="9">9</button><button class="operator" data-insert="−">−</button><button class="operator" data-insert="+">+</button><button class="equal" data-action="equals">=</button>
      <button data-insert="4">4</button><button data-insert="5">5</button><button data-insert="6">6</button><button class="wide" data-insert="0">0</button><button data-insert=".">.</button>
      <button data-insert="1">1</button><button data-insert="2">2</button><button data-insert="3">3</button><button class="wide" data-action="clear">清除</button><button data-action="equals">計算</button>
